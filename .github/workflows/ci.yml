name: CI

# Quality gates for Phase 0 (P0.txt §103). Every gate here is also runnable
# locally via `npm run verify`, so CI never fails on something a developer
# could not have caught first.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The authoritative Phase 4 runner executes all source probes and the
      # protected repository verify chain, and refuses to skip Postgres tests.
      - name: Phase 4 acceptance
        run: npm run accept:phase4
        env:
          ACALYS_REQUIRE_POSTGRES: "1"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-acceptance
          path: |
            .phase4-acceptance-report.json
            .vitest-report.json
            .diagnostics/
          if-no-files-found: ignore
