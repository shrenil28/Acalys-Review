services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acalys
      POSTGRES_USER: acalys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acalys -d acalys"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: backend
      args:
        ACALYS_SERVICE: migrate
    environment:
      DATABASE_URL: postgresql://acalys:${POSTGRES_PASSWORD}@postgres:5432/acalys
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    build:
      context: .
      target: backend
      args:
        ACALYS_SERVICE: bootstrap
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://acalys:${POSTGRES_PASSWORD}@postgres:5432/acalys
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      target: backend
      args:
        ACALYS_SERVICE: api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://acalys:${POSTGRES_PASSWORD}@postgres:5432/acalys
      PORT: "8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "8080:8080"
    restart: unless-stopped

  webhook-gateway:
    build:
      context: .
      target: backend
      args:
        ACALYS_SERVICE: webhook-gateway
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://acalys:${POSTGRES_PASSWORD}@postgres:5432/acalys
      PORT: "8081"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "8081:8081"
    restart: unless-stopped

  review-worker:
    build:
      context: .
      target: backend
      args:
        ACALYS_SERVICE: review-worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://acalys:${POSTGRES_PASSWORD}@postgres:5432/acalys
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        VITE_ACALYS_DATA_MODE: api
        VITE_ACALYS_API_URL: ${ACALYS_PUBLIC_API_URL:?set ACALYS_PUBLIC_API_URL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8082:8080"
    restart: unless-stopped

volumes:
  postgres-data:
